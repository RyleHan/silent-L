<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>silent-L figures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html, body { margin: 0; overflow: hidden; }
    .fig { width: 1600px; }
    .fig-title { font: 400 44px/1.05 "Instrument Serif", Georgia, serif; margin: 0 0 6px; letter-spacing: -0.01em; }
    .fig-title em { color: var(--other); }
    .fig-sub { font: 400 17px/1.5 "Inter", sans-serif; color: var(--muted); margin: 0 0 28px; max-width: 1180px; }
    .fig-foot { font: 12px/1.5 "JetBrains Mono", monospace; color: var(--faint); margin-top: 18px; display: flex; justify-content: space-between; }
    .hero-grid { display: grid; grid-template-columns: 540px 1fr; gap: 56px; align-items: center; }
    .hero-grid h1 { font: 400 124px/0.9 "Instrument Serif", Georgia, serif; margin: 20px 0 22px; letter-spacing: -0.02em; }
    .hero-grid h1 em { color: var(--other); }
    .hero-grid .lede { font-size: 20px; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 30px; }
    .stat-row div { background: var(--bg-2); padding: 14px 16px; }
    .stat-row .k { font: 500 10px/1 "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
    .stat-row .v { font: 400 30px/1.1 "Instrument Serif", Georgia, serif; margin-top: 8px; }
    .fig .player { padding: 18px; }
  </style>
</head>
<body class="figure">
  <div class="fig fig-pad" id="fig"></div>
  <script type="module" src="assets/figures.js"></script>
</body>
</html>
