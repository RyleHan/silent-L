vetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#B23A2E" text-anchor="middle">0%</text><text x="862.0" y="514.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B23A2E">The patch that worked offline destroys</text><text x="862.0" y="531.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B23A2E">behaviour the swapped prompt still had.</text><text x="1257.0" y="214.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#0F7B6C" letter-spacing="1.4">04</text><text x="1281.0" y="214.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6B7785" letter-spacing="1.4">PATHWAY REPLAY</text><text x="1257.0" y="274.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="500" fill="#0F7B6C">40/40</text><text x="1257.0" y="302.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7785">Full 18-block replay reproduces the</text><text x="1257.0" y="321.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7785">correct-prompt policy to exactly 0.0 error</text><text x="1332.0" y="356.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7785" text-anchor="middle" letter-spacing="0.3">All 18 blocks</text><rect x="1257.0" y="370.0" width="150.0" height="54.0" rx="4" fill="#DCEEE9"/><text x="1332.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#0F7B6C" text-anchor="middle">100%</text><rect x="1257.0" y="434.0" width="150.0" height="54.0" rx="4" fill="#DCEEE9"/><text x="1332.0" y="468.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#0F7B6C" text-anchor="middle">100%</text><text x="1433.0" y="384.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7785">action error</text><text x="1608.0" y="384.0" font-family="'SF Mono', Menlo, ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#14202E" text-anchor="end">0.0</text><line x1="1433.0" y1="393.0" x2="1608.0" y2="393.0" stroke="#E2E6EA" stroke-width="0.75"/><text x="1433.0" y="410.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7785">velocity error</text><text x="1608.0" y="410.0" font-family="'SF Mono', Menlo, ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#14202E" text-anchor="end">0.0</text><line x1="1433.0" y1="419.0" x2="1608.0" y2="419.0" stroke="#E2E6EA" stroke-width="0.75"/><text x="1433.0" y="436.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7785">hooks fired</text><text x="1608.0" y="436.0" font-family="'SF Mono', Menlo, ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#14202E" text-anchor="end">18 × 10</text><line x1="1433.0" y1="445.0" x2="1608.0" y2="445.0" stroke="#E2E6EA" stroke-width="0.75"/><text x="1433.0" y="462.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7785">held-out trials</text><text x="1608.0" y="462.0" font-family="'SF Mono', Menlo, ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#14202E" text-anchor="end">40</text><line x1="1433.0" y1="471.0" x2="1608.0" y2="471.0" stroke="#E2E6EA" stroke-width="0.75"/><text x="1257.0" y="514.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F7B6C">Replaying the whole prompt-conditioned</text><text x="1257.0" y="531.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F7B6C">pathway recovers the policy exactly.</text><line x1="72.0" y1="546.0" x2="1608.0" y2="546.0" stroke="#E2E6EA" stroke-width="1"/><text x="72.0" y="578.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#14202E">The failure is path incompatibility, not absence of the state: an intervention must preserve the model's computation path.</text><text x="72.0" y="602.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9AA4B0" letter-spacing="0.2">Locked test splits  ·  validation-only layer selection  ·  episode-cluster bootstrap  ·  norm-matched, shuffled and nullspace controls</text></svg>