<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="628" viewBox="0 0 1680 628" role="img" aria-label="Readable is not controllable: a four-step causal ladder"><style>text{font-variant-numeric:tabular-nums;}</style><rect x="0.0" y="0.0" width="1680.0" height="628.0" rx="0" fill="#FBFAF7"/><path d="M441.0 252.0 L449.0 261.0 L441.0 270.0" fill="none" stroke="#E2E6EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M836.0 252.0 L844.0 261.0 L836.0 270.0" fill="none" stroke="#E2E6EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1231.0 252.0 L1239.0 261.0 L1231.0 270.0" fill="none" stroke="#E2E6EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="72.0" y="62.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6B7785" letter-spacing="2.2">VLA WORLD-STATE ATLAS   ·   OPENVLA + π0.5   ·   LIBERO</text><text x="72.0" y="116.0" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="44" font-weight="400" fill="#14202E">Readable is not controllable.</text><text x="72.0" y="150.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#6B7785">Goal state is linearly decodable in two VLAs and locally causal inside the action expert — yet a single-block intervention fails closed-loop control.</text><line x1="72.0" y1="180.0" x2="1608.0" y2="180.0" stroke="#E2E6EA" stroke-width="1"/><text x="72.0" y="214.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#0F7B6C" letter-spacing="1.4">01</text><text x="96.0" y="214.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6B7785" letter-spacing="1.4">DECODE</text><text x="72.0" y="274.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="500" fill="#14202E">+0.60</text><text x="72.0" y="302.0" font-